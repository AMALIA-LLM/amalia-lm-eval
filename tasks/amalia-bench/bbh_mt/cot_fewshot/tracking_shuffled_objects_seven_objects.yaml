dataset_name: tracking_shuffled_objects_seven_objects
description: 'Uma tarefa que requer a determinação das posições finais de um conjunto
  de objectos dadas as suas posições iniciais e uma descrição de uma sequência de
  trocas.


  '
doc_to_text: 'P: {{input}}

  R: Vamos pensar passo a passo.

  '
fewshot_config:
  sampler: first_n
  samples:
  - input: "A Alice, o Pedro e a Clara estão a jogar um jogo. No início do jogo, cada
      um deles tem uma bola na mão: A Alice tem uma bola amarela, o Pedro tem uma
      bola azul e a Clara tem uma bola cor-de-rosa.\nÀ medida que o jogo avança, os
      pares de jogadores trocam as bolas. Primeiro, a Clara e a Alice trocam as bolas.
      Depois, a Alice e o Bob trocam as bolas. Por fim, a Clara e o Bob trocam as
      bolas. No final do jogo, o Bob tem a bola\nopções:\n(A) bola amarela\n(B) bola
      azul\n(C) bola cor-de-rosa"
    target: "Vamos pensar passo a passo.\n(0) No início: Alice: amarelo, Bob: azul,
      Claire: cor-de-rosa.\n(1) A Claire e a Alice trocam as bolas: Alice: cor-de-rosa,
      Bob: azul, Claire: amarela.\n(2) Alice e Bob trocam as bolas: Alice: azul, Bob:
      cor-de-rosa, Claire: amarela.\n(3) A Claire e o Bob trocam as bolas: Alice:
      azul, Bob: amarela, Claire: cor-de-rosa.\nNo final do jogo, o Bob tem a bola
      amarela. Portanto, a resposta é (A)."
  - input: "A Alice, o Pedro e a Clara estão a jogar um jogo. No início do jogo, cada
      um deles tem uma bola na mão: A Alice tem uma bola branca, o Bob tem uma bola
      roxa e a Claire tem uma bola cor-de-rosa.\nÀ medida que o jogo avança, os pares
      de jogadores trocam as bolas. Primeiro, o Bob e a Alice trocam as bolas. Depois,
      o Bob e a Claire trocam as bolas. Finalmente, o Bob e a Alice trocam as bolas.
      No final do jogo, a Alice tem a\nopções:\n(A) bola branca\n(B) bola roxa\n(C)
