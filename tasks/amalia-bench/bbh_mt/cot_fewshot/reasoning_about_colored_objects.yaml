dataset_name: reasoning_about_colored_objects
description: 'Responder a perguntas extremamente simples sobre as cores dos objectos
  numa superfície.


  '
doc_to_text: 'P: {{input}}

  R: Vamos pensar passo a passo.

  '
fewshot_config:
  sampler: first_n
  samples:
  - input: "Na mesa de cabeceira, há um lápis vermelho, uma caneca roxa, um porta-chaves
      cor de vinho, um ursinho de peluche fúcsia, um prato preto e uma bola anti-stress
      azul. De que cor é a bola anti-stress?\nOpções:\n(A) vermelho\n(B) laranja\n
      (C) amarelo\n(D) verde\n(E) azul\n(F) castanho\n(G) magenta\n(H) fúcsia\n(I)
      malva\n(J) azul-petróleo\n(K) turquesa\n(L) borgonha\n(M) prata\n(N) dourado\n
      (O) preto\n(P) cinzento\n(Q) púrpura\n(R) cor-de-rosa"
    target: "Vamos pensar passo a passo.\nDe acordo com esta pergunta, a cor da bola
      de stress é azul. Por isso, a resposta é (E)."
  - input: "Em cima da mesa, vê um conjunto de objectos dispostos em fila: um clip
      roxo, uma bola anti-stress cor-de-rosa, um porta-chaves castanho, um carregador
      de telemóvel verde, um fidget spinner lilás e uma caneta cor de vinho. Qual
      é a cor do objeto diretamente à direita da bola de stress?\nOpções:\n(A) vermelho\n
      (B) laranja\n(C) amarelo\n(D) verde\n(E) azul\n(F) castanho\n(G) magenta\n(H)
      fúcsia\n(I) malva\n(J) azul-petróleo\n(K) turquesa\n(L) borgonha\n(M) prata\n
      (N) dourado\n(O) preto\n(P) cinzento\n(Q) púrpura\n(R) cor-de-rosa"
    target: "Vamos pensar passo a passo.\nDe acordo com esta pergunta, os objectos
      estão dispostos numa fila, da esquerda para a direita, da seguinte forma: (1)
      um clipe roxo, (2) uma bola anti-stress cor-de-rosa, (3) um porta-chaves castanho,
      (4) um carregador de telemóvel verde, (5) um fidget spinner cor de malva, (6)
      uma caneta cor de vinho.\nA bola anti-stress é o segundo objeto da lista, ou
      seja, (2). O objeto que se encontra à direita da bola anti-stress corresponde
      a (3), que é um porta-chaves castanho.\nA cor do chaveiro é castanha. Portanto, a resposta é (F)."
  - input: "Na mesa de cabeceira, vê os seguintes itens dispostos em fila: um prato
      azul-petróleo, um porta-chaves cor de vinho, um carregador de telemóvel amarelo,
      uma caneca cor de laranja, um caderno cor-de-rosa e uma chávena cinzenta. Quantos
      objectos não cor de laranja vê à esquerda do objeto azul-petróleo?\nOpções:\n
      (A) zero\n(B) um\n(C) dois\n(D) três\n(E) quatro\n(F) cinco\n(G) seis"
    target: "Vamos pensar passo a passo.\nDe acordo com esta pergunta, os objectos
      estão dispostos numa fila, da esquerda para a direita, da seguinte forma: (1)
      um prato azul-petróleo, (2) um porta-chaves cor de vinho, (3) um carregador
      de telemóvel amarelo, (4) uma caneca cor de laranja, (5) um caderno cor-de-rosa,
      (6) uma chávena cinzenta.\nO prato azul-petróleo é o primeiro objeto, ou seja,
      (1). Não existe nenhum objeto à esquerda do objeto azul-petróleo.\nO número
      de objectos não cor de laranja à esquerda do objeto azul-petróleo é zero. Portanto, a resposta é (A)."
include: _cot_fewshot_template_yaml
task: bbh_cot_fewshot_reasoning_about_colored_objects_mt_pt
