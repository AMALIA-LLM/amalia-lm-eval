dataset_name: web_of_lies
description: 'Avaliar uma função booleana aleatória expressa como um problema de palavras.


  '
doc_to_text: 'P: {{input}}

  R: Vamos pensar passo a passo.

  '
fewshot_config:
  sampler: first_n
  samples:
  - input: 'Pergunta: Fidel diz a verdade. Jerry diz que Fidel diz a verdade. Vina
      diz que Jerry diz a verdade. Millicent diz que Vina mente. Raimundo diz que
      Millicent mente. O Raymond diz a verdade?'
    target: "Vamos pensar passo a passo.\n(1) Fidel diz a verdade. Portanto, sabemos
      que Fidel diz a verdade.\n(2) O Jerry diz que o Fidel diz a verdade. Como sabemos
      de (1) que Fidel diz a verdade, se o Jerry diz que Fidel diz a verdade, então
      Jerry diz a verdade.\n(3) Vina diz que Jerry diz a verdade. Como sabemos de
      (2) que Jerry diz a verdade, se Vina diz que Jerry diz a verdade, então Vine
      diz a verdade.\n(4) Millicent diz que Vina mente. Como sabemos de (3) que Vina
      diz a verdade, se Millicent diz que Vina mente, então Millicent mente.\n(5)
      O Raimundo diz que a Millicent mente. Como sabemos de (4) que a Millicent mente,
      se o Raimundo diz que a Millicent mente, então o Raimundo diz a verdade.\nAgora,
      a pergunta é: O Raymond diz a verdade? Sabemos por (5) que o Raimundo diz a
      verdade. Portanto, a resposta é Sim."
  - input: 'Pergunta: Kristian mente. A Millie diz que o Kristian mente. Maybelle
      diz que Millie diz a verdade. Fidel diz que Maybelle mente. Leda diz que Fidel
