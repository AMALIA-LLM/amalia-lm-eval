dataset_name: formal_fallacies
description: 'Distinguir argumentos dedutivamente válidos de falácias formais.


  '
doc_to_text: 'P: {{input}}

  R:'
fewshot_config:
  sampler: first_n
  samples:
  - input: "\"Nem sempre é fácil perceber quem está relacionado com quem - e de que
      forma. O argumento que se segue diz respeito a esta questão: Para começar, Lesley
      é uma amiga íntima de Fernando. Além disso, ser amigo íntimo de Fernando ou
      colega de escola de Lowell é suficiente para ser bisavô de Leroy. Segue-se que
      Lesley é bisavô de Leroy\".\nO argumento, dadas as premissas explicitadas, é
      dedutivamente válido ou inválido?\nOpções:\n- válido\n- inválido"
    target: válido
  - input: "\"Nem sempre é fácil perceber quem é parente de quem - e de que forma.
      O argumento seguinte diz respeito a esta questão: Quem não for bisavô de Clyde
      é meio-irmão de Brian. Ser um antepassado de Dana é suficiente para não ser
      bisavô de Clyde. Podemos concluir: Toda a gente que é antepassado de Dana é
      também meio-irmão de Brian\".\nO argumento, dadas as premissas explicitamente
      declaradas, é dedutivamente válido ou inválido?\nOpções:\n- válido\n- inválido"
    target: válido
  - input: "\"Nem sempre é fácil perceber quem está a consumir que produtos. O argumento
      seguinte diz respeito a esta questão: Cada utilizador pouco frequente do champô
      Paul Mitchell é um consumidor raro de champô Nioxin ou um comprador fiel do
      sabonete Caress, ou ambos. Nenhum consumidor regular do sabonete Lush é um consumidor
      raro do champô Nioxin e, ao mesmo tempo, um comprador fiel do sabonete Caress.
      Segue-se que quem quer que seja um utilizador pouco frequente do champô Paul
      Mitchell não é um consumidor regular do sabonete Lush.\"\nO argumento, dadas
      as premissas explicitadas, é dedutivamente válido ou inválido?\nOpções:\n- válido\n
      - inválido"
    target: inválido
include: _fewshot_template_yaml
task: bbh_fewshot_formal_fallacies_mt_pt
