"dataset_name": "sports_understanding"
"description": "Determinar se uma frase construída artificialmente e relacionada com
  o desporto é plausível ou não.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_sports_understanding_mt_pt"

filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: !function utils.MapRegexFilter
    group_select: 0
    ignore_case: true
    regex_pattern_to_value:
      \b(no|not plausible)\b: "no"
      \b(yes|plausible)\b: "yes"
  - function: "take_first"
