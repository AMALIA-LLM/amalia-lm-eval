"dataset_name": "object_counting"
"description": "Perguntas que envolvem a enumeração de objectos e que pedem ao modelo
  para os contar.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_object_counting_mt_pt"
filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: !function utils.NumberParseRegexFilter
    group_select: 0
    regex_pattern: "([-0-9]+)"
  - function: "take_first"
