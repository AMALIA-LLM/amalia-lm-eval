"dataset_name": "boolean_expressions"
"description": "Avalia o resultado de uma expressão booleana aleatória.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_boolean_expressions_mt_pt"

filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: "regex"
    group_select: 0
    regex_pattern: "\\b(Verdadeiro|Falso|Verdadeira|Falsa)\\b"
  - function: "take_first"
