"dataset_name": "dyck_languages"
"description": "Fechar corretamente uma palavra Dyck-n.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_dyck_languages_mt_pt"
filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: "regex"
    group_select: 0
    regex_pattern: "(?<= )([\" \\[\\(<{}>\\)\\]]+)|([\" \\[\\(<{}>\\)\\]]+)"
  - function: "take_first"
