"dataset_name": "movie_recommendation"
"description": "Recomendar filmes semelhantes à lista de filmes dada.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_movie_recommendation_mt_pt"
filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: !function utils.MultiChoiceRegexFilter
    group_select: 0
    ignore_case: true
    ignore_punctuation: true
    regex_pattern: "(\\([A-Z]\\))"
  - function: "take_first"
