"dataset_name": "temporal_sequences"
"description": "Descrição da tarefa: Responder a perguntas sobre a altura em que determinados
  acontecimentos podem ter ocorrido.\n\n"
"doc_to_text": "P: {{input}}\nR:"
"include": "_zeroshot_template_yaml"
"task": "bbh_zeroshot_temporal_sequences_mt_pt"
filter_list:
- name: "strict-match"
  filter:
  - function: "take_first"
- name: "flexible-extract"
  filter:
  - function: !function utils.MultiChoiceRegexFilter
    group_select: 0
    ignore_case: true
    ignore_punctuation: true
    regex_pattern: "(\\([A-Z]\\))"
  - function: "take_first"
