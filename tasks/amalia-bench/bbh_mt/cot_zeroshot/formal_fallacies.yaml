"dataset_name": "formal_fallacies"
"description": "Distinguir argumentos dedutivamente válidos de falácias formais.\n\
  \n"
"doc_to_text": "P: {{input}}\nR: Vamos pensar passo a passo."
"include": "_cot_zeroshot_template_yaml"
"task": "bbh_cot_zeroshot_formal_fallacies_mt_pt"

filter_list:
- name: "flexible-extract"
  filter:
  - function: "regex"
    group_select: -1
    regex_pattern: "\\b(válido|inválido|valido|invalido|válida|inválida|valida|invalida)\\b"
  - function: "take_first"
- name: "strict-match"
  filter:
  - function: "regex"
    regex_pattern: "((?<=A resposta é )(.*)(?=.)|(?<=a resposta é )(.*)(?=.)|(?<=A resposta: )(.*)(?=.)|(?<=A resposta final: )(.*)(?=.))"
  - function: "take_first"
