"dataset_name": "web_of_lies"
"description": "Avaliar uma função booleana aleatória expressa como um problema de
  palavras.\n\n"
"doc_to_text": "P: {{input}}\nR: Vamos pensar passo a passo."
"include": "_cot_zeroshot_template_yaml"
"task": "bbh_cot_zeroshot_web_of_lies_mt_pt"
filter_list:
- name: "flexible-extract"
  filter:
  - function: !function utils.MapRegexFilter
    group_select: -1
    ignore_case: true
    regex_pattern_to_value:
      \b(no|does not tell the truth|is not telling the truth)\b: "no"
      \b(yes|tells the truth|is telling the truth)\b: "yes"
  - function: "take_first"
- name: "strict-match"
  filter:
  - function: "regex"
    regex_pattern: "((?<=A resposta é )(.*)(?=.)|(?<=a resposta é )(.*)(?=.)|(?<=A resposta: )(.*)(?=.)|(?<=A resposta final: )(.*)(?=.))"
  - function: "take_first"
