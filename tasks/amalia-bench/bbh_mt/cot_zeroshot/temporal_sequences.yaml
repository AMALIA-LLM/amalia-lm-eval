"dataset_name": "temporal_sequences"
"description": "Descrição da tarefa: Responder a perguntas sobre a altura em que determinados
  acontecimentos podem ter ocorrido.\n\n"
"doc_to_text": "P: {{input}}\nR: Vamos pensar passo a passo."
"include": "_cot_zeroshot_template_yaml"
"task": "bbh_cot_zeroshot_temporal_sequences_mt_pt"
filter_list:
- name: "flexible-extract"
  filter:
  - function: !function utils.MultiChoiceRegexFilter
    group_select: -1
    ignore_case: true
    ignore_punctuation: true
    regex_pattern: "(\\([A-Z]\\))"
  - function: "take_first"
- name: "strict-match"
  filter:
  - function: "regex"
    regex_pattern: "((?<=A resposta é )(.*)(?=.)|(?<=a resposta é )(.*)(?=.)|(?<=A resposta: )(.*)(?=.)|(?<=A resposta final: )(.*)(?=.))"
  - function: "take_first"
