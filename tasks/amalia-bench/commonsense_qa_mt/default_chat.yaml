task: commonsense_qa-mt-pt-chat
dataset_path: amalia-llm/commonsense_qa-mt-pt
training_split: train
validation_split: validation
output_type: multiple_choice
doc_to_text: "Pergunta: {{ question.strip() }}\nA. {{choices['text'][0]}}\nB. {{choices['text'][1]}}\nC. {{choices['text'][2]}}\nD. {{choices['text'][3]}}\nE. {{choices['text'][4]}}\n"
gen_prefix: "A resposta é"
doc_to_target: answerKey
doc_to_choice: ['A', 'B', 'C', 'D', 'E']
metric_list:
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: acc
    aggregation: mean
    higher_is_better: true
