dataset_path: Paulo-FOAAP/licenciamento-pt
dataset_kwargs:
  revision: ef2162977464f104dd031550dfd380f7ff7562e9
task: licenciamento_pt_mcq_chat
tag: licenciamento_pt
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: !function utils.doc_to_text_mcq
gen_prefix: 'A melhor resposta é'
doc_to_target: answerKey
generation_kwargs:
  max_gen_toks: 100
  until:
    - "\n\n"
    - "."
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metadata:
  version: 1.0
