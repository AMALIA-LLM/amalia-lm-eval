    aggregation: mean
    higher_is_better: true
  - metric: exact_quote
    aggregation: mean
    higher_is_better: true
  - metric: not_verbatim
    aggregation: mean
    higher_is_better: false
  - metric: added_words
    aggregation: mean
    higher_is_better: false
metadata:
  version: 1.0
