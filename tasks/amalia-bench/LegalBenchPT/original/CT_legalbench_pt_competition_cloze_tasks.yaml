dataset_path: BeatrizCanaverde/LegalBench.PT
dataset_name: Direito_da_Concorrência
test_split: test
task: amalia_legalbench_pt_competition_cloze_tasks
task_alias: competition_cloze_tasks
#tag: amalia_legalbench_pt_competition
doc_to_text: Question
doc_to_target: Answer
process_docs: !function utils.process_cloze_tasks
output_type: generate_until
generation_kwargs:
  until: []
  do_sample: true
  temperature: 0.001
  max_gen_toks: 2000
metric_list:
  - metric: !function utils.legal_metric
    aggregation: !function utils.legal_metric_agg
    higher_is_better: true
metadata:
  version: 0.0