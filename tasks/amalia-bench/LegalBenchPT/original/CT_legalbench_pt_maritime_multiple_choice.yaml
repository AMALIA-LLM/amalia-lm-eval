dataset_path: BeatrizCanaverde/LegalBench.PT
dataset_name: Direito_Marítimo
test_split: test
task: amalia_legalbench_pt_maritime_multiple_choice
task_alias: maritime_multiple_choice
#tag: amalia_legalbench_pt_maritime
doc_to_text: Question
doc_to_target: Answer
process_docs: !function utils.process_multiple_choice
output_type: generate_until
generation_kwargs:
