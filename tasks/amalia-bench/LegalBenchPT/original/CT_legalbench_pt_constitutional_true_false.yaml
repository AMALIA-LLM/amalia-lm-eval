dataset_path: BeatrizCanaverde/LegalBench.PT
dataset_name: Direito_Constitucional
test_split: test
task: amalia_legalbench_pt_constitutional_true_false
task_alias: constitutional_true_false
#tag: amalia_legalbench_pt_constitutional
doc_to_text: Question
doc_to_target: Answer
process_docs: !function utils.process_true_false
output_type: generate_until
generation_kwargs:
