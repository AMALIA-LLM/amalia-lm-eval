task: amalia_dsl_tl_pt_mcq_chat
dataset_path: LCA-PORVID/dsl_tl
output_type: multiple_choice
training_split: train
test_split: test
doc_to_text: "Qual é a variante de português utilizada neste texto: {{text}} 
PT-PT para a variante de português de Portugal, PT-BR para a variante de português do Brasil, e N/A se não for possível identificar a variante.
Escolha a opção correta:
A. PT-PT
B. PT-BR
C. N/A
"
gen_prefix: "A resposta é"
doc_to_target: "{{'A' if label == 0 else ('B' if label == 1 else 'C')}}"
doc_to_choice: "['A', 'B', 'C']"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0