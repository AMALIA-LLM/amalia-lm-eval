[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amalia-eval"
version = "0.1.0"
description = "A framework for evaluating language models in pt-pt."
authors = [
    { name = "AMALIA Team" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes; platform_machine == 'x86_64'",
    "click==8.2.1",
    "cloudpickle==3.1.1",
    "datasets>=3,<4",
    "Flask>=3.0.0",
    "google-genai==1.43.0",
    "Jinja2==3.1.6",
    "immutabledict==4.2.2",
    "matplotlib",
    "transformers==4.57.1",
    "numpy==2.2.6",
    "omegaconf==2.4.0.dev3",
    "protobuf==6.32.1",
    "pygsheets",
    "pytrec_eval",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.15",
    "sentencepiece==0.2.1",
    "torch==2.8.0",
    "tyro==0.9.35",
    "vllm==0.11.0",
    "seaborn==0.13.2",
    "streamlit==1.52.1",
    "plotly==6.5.0",
    "wandb",
    "nltk==3.9.2",
    "wonderwords==3.0.1",
    "math-verify[antlr4_11_0]",
    "lm_eval[vllm] @ git+https://github.com/AMALIA-LLM/lm-evaluation-harness.git"
]

[project.scripts]
amalia = "scripts.cli:main"
amalia-inspect = "scripts.cli:inspect_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["configs*", "tasks*", "scripts*", "inspect*"]

[tool.setuptools.package-data]
"inspect" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 88
target-version = ["py312"]
# Avoid conflicts with Black's formatting decisions
extend-ignore = ["E203", "W503"]
# Skip common build / cache folders
exclude = ["build", "dist", ".venv", "venv", ".git", "__pycache__", ".mypy_cache", ".pytest_cache"]
# Ensure import-order checks are included
extend-select = ["I"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "S101", "F401"]
"scripts/*" = ["E402", "F401"]
"**/migrations/*" = ["E402", "F401"]