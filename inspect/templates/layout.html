<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AMALIA Inspect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.dataTables.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
  <a class="navbar-brand" href="{{ url_for('overview', root=selected_root, mode=active_mode, tasks_mode=active_tasks_mode) }}">AMALIA Inspect</a>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('models_page', root=selected_root, mode=active_mode, tasks_mode=active_tasks_mode) }}">Models</a>
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('benchmarks_page', root=selected_root, mode=active_mode, tasks_mode=active_tasks_mode) }}">Benchmarks</a>
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('edit_display_names', root=selected_root, mode=active_mode, tasks_mode=active_tasks_mode) }}">Display names</a>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="navbar-text text-light mb-0">
            Root: <code>{{ selected_root_path }}</code>
          </div>
        </div>
      </div>
    </nav>
    <main class="container-fluid mb-4">
      {% block content %}{% endblock %}
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
